name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Install Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
        unzip -q gradle-8.10.2-bin.zip
        sudo mv gradle-8.10.2 /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitcoin-ledger-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
